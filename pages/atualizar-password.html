<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Palavra-Passe — MailFlow Pro</title>
    <meta name="description" content="Defina a sua nova palavra-passe.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>">
</head>
<body class="auth-page">
    <div class="auth-page__bg" aria-hidden="true"></div>
    <div class="auth-page__orb auth-page__orb--1" aria-hidden="true"></div>
    <div class="auth-page__orb auth-page__orb--2" aria-hidden="true"></div>

    <main class="auth-page__main">
        <div class="auth-page__form-wrapper" style="max-width:480px;margin:auto;">
            <div class="auth-card">
                <a href="../" class="auth-card__logo-mobile" aria-label="MailFlow Pro">
                    <span class="auth-hero__logo-icon" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#grad2)"/><path d="M8 11L16 19L24 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="grad2" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs></svg>
                    </span>
                    <span>MailFlow Pro</span>
                </a>

                <h1 class="auth-card__title">Definir Nova Palavra-Passe</h1>
                <p class="auth-card__subtitle">Escolha uma palavra-passe segura.</p>

                <form id="update-password-form" class="auth-form" novalidate>
                    <div class="auth-form__group">
                        <label for="password" class="auth-form__label">Nova Palavra-Passe</label>
                        <div class="auth-form__input-wrapper">
                            <svg class="auth-form__input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="password" name="password" class="auth-form__input" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                            <button type="button" class="auth-form__toggle" id="toggle-password" aria-label="Mostrar password" aria-pressed="false">
                                <svg class="auth-form__toggle-icon auth-form__toggle-icon--show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="auth-form__toggle-icon auth-form__toggle-icon--hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-5.523 0-10-4.477-10-10a10.07 10.07 0 0 1 4.34-9.34"/><path d="M1 1l22 22"/></svg>
                            </button>
                        </div>
                    </div>

                    <div id="error-message" class="auth-form__error" role="alert" hidden></div>

                    <button type="submit" id="btn-submit" class="auth-form__btn">
                        <span class="auth-form__btn-text">Atualizar Palavra-Passe</span>
                        <span class="auth-form__btn-loading" hidden>
                            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
                            A atualizar...
                        </span>
                    </button>
                </form>

                <p class="auth-card__footer">
                    <a href="../entrar.html" class="auth-card__link">Voltar ao login</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
    (function() {
        'use strict';
        var form = document.getElementById('update-password-form');
        var btnSubmit = document.getElementById('btn-submit');
        var btnText = btnSubmit.querySelector('.auth-form__btn-text');
        var btnLoading = btnSubmit.querySelector('.auth-form__btn-loading');
        var errorEl = document.getElementById('error-message');

        // Check for recovery token
        (async function() {
            var sb = window.supabaseClient;
            if (!sb) return;
            var { data, error } = await sb.auth.getSession();
            if (error || !data?.session) {
                showError('Link inválido ou expirado. Solicite um novo link de recuperação.');
                btnSubmit.disabled = true;
            }
        })();

        document.getElementById('toggle-password')?.addEventListener('click', function() {
            var pwd = document.getElementById('password');
            var isPassword = pwd.type === 'password';
            pwd.type = isPassword ? 'text' : 'password';
            this.setAttribute('aria-pressed', isPassword);
            this.setAttribute('aria-label', isPassword ? 'Ocultar password' : 'Mostrar password');
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            var password = document.getElementById('password').value;
            if (password.length < 6) { showError('A palavra-passe deve ter pelo menos 6 caracteres.'); return; }

            setLoading(true);
            hideError();

            try {
                var sb = window.supabaseClient;
                if (!sb) { showError('Erro de configuração.'); setLoading(false); return; }

                var { error } = await sb.auth.updateUser({ password: password });
                if (error) {
                    showError(error.message || 'Erro ao atualizar palavra-passe.');
                } else {
                    form.innerHTML = '<div style="text-align:center;padding:32px;"><svg width="48" height="48" fill="none" stroke="#10b981" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><h3 style="margin:16px 0 8px;">Palavra-passe atualizada!</h3><p style="color:#64748b;margin-bottom:24px;">A sua palavra-passe foi alterada com sucesso.</p><a href="../entrar.html" class="auth-form__btn" style="display:inline-flex;text-decoration:none;">Entrar na conta</a></div>';
                }
            } catch (err) {
                console.error('[Atualizar] Erro:', err);
                showError('Erro de conexão. Tente novamente.');
            }
            setLoading(false);
        });

        function setLoading(loading) { btnSubmit.disabled = loading; btnText.hidden = loading; btnLoading.hidden = !loading; }
        function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
        function hideError() { errorEl.hidden = true; errorEl.textContent = ''; }
    })();
    </script>
</body>
</html>
