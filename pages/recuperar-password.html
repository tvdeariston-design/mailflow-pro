<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Palavra-Passe — MailFlow Pro</title>
    <meta name="description" content="Recupere o acesso à sua conta MailFlow Pro.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>">
</head>
<body class="auth-page">
    <div class="auth-page__bg" aria-hidden="true"></div>
    <div class="auth-page__orb auth-page__orb--1" aria-hidden="true"></div>
    <div class="auth-page__orb auth-page__orb--2" aria-hidden="true"></div>

    <main class="auth-page__main">
        <div class="auth-page__form-wrapper" style="max-width:480px;margin:auto;">
            <div class="auth-card">
                <a href="../" class="auth-card__logo-mobile" aria-label="MailFlow Pro — Página inicial">
                    <span class="auth-hero__logo-icon" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#grad2)"/><path d="M8 11L16 19L24 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="grad2" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs></svg>
                    </span>
                    <span>MailFlow Pro</span>
                </a>

                <h1 class="auth-card__title">Recuperar Palavra-Passe</h1>
                <p class="auth-card__subtitle">Enviaremos um link de recuperação para o seu email.</p>

                <form id="recover-form" class="auth-form" novalidate>
                    <div class="auth-form__group">
                        <label for="email" class="auth-form__label">Email</label>
                        <div class="auth-form__input-wrapper">
                            <svg class="auth-form__input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            <input type="email" id="email" name="email" class="auth-form__input" placeholder="O seu email de acesso" required autocomplete="email">
                        </div>
                    </div>

                    <div id="error-message" class="auth-form__error" role="alert" hidden></div>
                    <div id="success-message" class="auth-form__success" role="alert" hidden></div>

                    <button type="submit" id="btn-submit" class="auth-form__btn">
                        <span class="auth-form__btn-text">Enviar Link de Recuperação</span>
                        <span class="auth-form__btn-loading" hidden>
                            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
                            A enviar...
                        </span>
                    </button>
                </form>

                <p class="auth-card__footer">
                    <a href="../entrar.html" class="auth-card__link">Voltar ao login</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
    (function() {
        'use strict';
        var form = document.getElementById('recover-form');
        var btnSubmit = document.getElementById('btn-submit');
        var btnText = btnSubmit.querySelector('.auth-form__btn-text');
        var btnLoading = btnSubmit.querySelector('.auth-form__btn-loading');
        var errorEl = document.getElementById('error-message');
        var successEl = document.getElementById('success-message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            if (!email) { showError('Introduza o seu email.'); return; }

            setLoading(true);
            hideError();
            hideSuccess();

            try {
                var sb = window.supabaseClient;
                if (!sb) { showError('Erro de configuração. Tente novamente.'); setLoading(false); return; }

                var { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/pages/atualizar-password.html'
                });

                if (error) {
                    showError(error.message === 'User not found' ? 'Email não encontrado.' : 'Erro ao enviar link. Tente novamente.');
                } else {
                    showSuccess('Link de recuperação enviado! Verifique o seu email.');
                    form.querySelector('.auth-form__btn-text').textContent = 'Reenviar Link';
                }
            } catch (err) {
                console.error('[Recuperar] Erro:', err);
                showError('Erro de conexão. Verifique a sua ligação à internet.');
            }
            setLoading(false);
        });

        function setLoading(loading) { btnSubmit.disabled = loading; btnText.hidden = loading; btnLoading.hidden = !loading; }
        function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
        function hideError() { errorEl.hidden = true; errorEl.textContent = ''; }
        function showSuccess(msg) { successEl.textContent = msg; successEl.hidden = false; }
        function hideSuccess() { successEl.hidden = true; successEl.textContent = ''; }
    })();
    </script>
    <style>
        .auth-form__success { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px 16px; font-size: 0.8125rem; color: #166534; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    </style>
</body>
</html>
